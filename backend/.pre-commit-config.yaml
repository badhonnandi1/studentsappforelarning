repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && uv run mypy src tests migrations scripts'
        language: system
        pass_filenames: false
        types: [python]
      - id: line-limit
        name: 200-line rule
        entry: bash -c 'cd backend && uv run python scripts/check_file_length.py'
        language: system
        pass_filenames: false
      - id: boundaries
        name: module boundaries
        entry: bash -c 'cd backend && uv run lint-imports && uv run python scripts/check_boundaries.py'
        language: system
        pass_filenames: false
        types: [python]
