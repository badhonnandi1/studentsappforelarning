[project]
name = "studyplatform-backend"
version = "0.1.0"
description = "FastAPI modular monolith for the Bangladesh study platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.17",
    "redis>=6.4",
    "structlog>=25.4",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "cryptography>=46",
    "aioboto3>=15",
    "pyarrow>=21",
    "opentelemetry-api>=1.38",
    "opentelemetry-sdk>=1.38",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8",
    "mypy>=1.18",
    "ruff>=0.14",
    "import-linter>=2.5",
    "grimp>=3.12",
    "pre-commit>=4.3",
    "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "migrations", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "ASYNC", "N", "SIM", "RUF", "PT", "T20", "ARG"]
ignore = ["E501"]
# Bangla digits and the en dash are intended text, not look-alike Latin characters.
allowed-confusables = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯", "–"]

[tool.ruff.lint.isort]
known-first-party = ["app", "migrations", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "S603", "ARG001"]
"tests/conftest.py" = ["E402"]
"migrations/versions/**" = ["N999", "S608"]  # DDL built from module constants
"scripts/**" = ["T201", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true
disallow_any_generics = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "pyarrow.*", "grimp.*", "asyncpg.*", "botocore.*", "aiobotocore.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers -p no:cacheprovider"
filterwarnings = ["error"]
markers = [
    "unit: pure functions, no I/O",
    "integration: real Redis, S3 or subprocesses",
    "api: HTTP through the ASGI app",
    "db: real Postgres in a rolled-back transaction",
    "concurrency: several committed connections",
    "contract: cross-module and event contracts",
    "slow: longer than a few seconds",
    "eval: model evaluation (not in CI by default)",
    "load: load tests (never in CI)",
]

[tool.coverage.run]
branch = true
source = ["app"]
concurrency = ["thread", "greenlet"]  # SQLAlchemy async runs DB calls in greenlets
omit = ["*/entrypoints/*/main.py"]

[tool.coverage.report]
fail_under = 85
skip_covered = true
show_missing = true

[tool.critical_coverage]
threshold = 95
paths = [
    "app/core/security/*",
    "app/core/ratelimit.py",
    "app/modules/nfr/internal/services/idempotency.py",
    "app/modules/nfr/internal/services/runner.py",
    "app/modules/nfr/internal/services/consumer.py",
    "app/modules/auth/internal/services/*",
    "app/modules/auth/internal/providers/*",
    "app/modules/ops/internal/services/audited.py",
]
