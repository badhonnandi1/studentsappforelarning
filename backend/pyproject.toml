[project]
name = "studyplatform-backend"
version = "0.1.0"
description = "Bangladesh Practice + AI Tutor platform: modular-monolith backend (see docs/system-design-v2.md)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=25.1",
]

[project.scripts]
workers = "app.entrypoints.workers:main"
exam-consumers = "app.entrypoints.exam_consumers:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "import-linter>=2.1",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py313"
line-length = 100
# copies of the fastapi-starter shared helpers, kept byte-identical
extend-exclude = ["src/app/shared/money.py", "src/app/shared/bd_phone.py", "src/app/shared/dhaka_date.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "ASYNC", "N", "SIM", "RUF", "PT", "T20", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S603"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
